<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Coupon Code - Fabzia Turf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="utility.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', 'Lato', sans-serif; background-color: #f5f5f5; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* BOTTOM SHEETS */
        .bs-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.45); display:none; align-items:flex-end; justify-content:center; }
        .bs-overlay.open { display:flex; }
        .bs-panel { position:relative; width:100%; max-width:430px; background:#fff; border-radius:16px 16px 0 0; animation:bsSlideUp 0.3s cubic-bezier(0.4,0,0.2,1); max-height: 80vh; display: flex; flex-direction: column; }
        @keyframes bsSlideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
        
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; background: #eef4fd; color: #125dcd; border-radius: 16px; font-size: 14px; font-weight: 500; }
        
        .radio-btn { width:24px; height:24px; border-radius:50%; border:1.5px solid #d7d7d7; display:flex; align-items:center; justify-content:center; }
        .radio-btn.active { border-color:#125dcd; background:#125dcd; }
        .radio-btn.active::after { content:''; width:8px; height:8px; border-radius:50%; background:#fff; }
        
        .check-box { width:24px; height:24px; border-radius:4px; border:1.5px solid #d7d7d7; display:flex; align-items:center; justify-content:center; cursor: pointer; transition: all 0.2s; }
        .check-box.active { border-color:#125dcd; background:#125dcd; }
        
        /* Inline Calendar */
        .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:12px; }
        .cal-cell { text-align:center; padding:8px 4px; font-size:14px; cursor:pointer; border-radius:8px; color: #1a1a1a; font-weight: 500; transition: all 0.15s; }
        .cal-cell.selected { background:#125dcd; color:#fff; }
        .cal-cell.other-month { color:#ababab; }
        
        /* Time Grid */
        .time-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
        .time-cell { text-align:center; padding:10px 4px; font-size:14px; cursor:pointer; border-radius:8px; border: 1px solid #d7d7d7; color: #1a1a1a; font-weight: 500;}
        .time-cell.selected { background:#125dcd; border-color:#125dcd; color:#fff; }

        /* Disable Number Input Arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-50 text-[var(--text-body)] antialiased flex items-center justify-center min-h-screen">
    
    <div class="relative w-full max-w-[430px] h-[100dvh] max-h-[812px] bg-[var(--white-pure)] shadow-2xl overflow-hidden flex flex-col font-inter">
        
        <!-- Top Navigation -->
        <div class="flex items-center gap-2 px-1 py-2 border-b border-[var(--bg-container)] bg-white h-16 flex-shrink-0 z-10">
            <button onclick="showCancelPopup()" class="flex items-center justify-center w-12 h-12 flex-shrink-0">
                <i data-lucide="chevron-left" class="w-6 h-6 text-[#1a1a1a]"></i>
            </button>
            <div class="flex-1">
                <h1 class="text-[#1a1a1a] text-[18px] font-medium leading-[28px]">Add Coupon Code</h1>
            </div>
        </div>

        <!-- Form Section -->
        <div class="flex-1 overflow-y-auto no-scrollbar pb-[90px]">
            <div class="flex flex-col gap-[20px] px-4 pt-4 pb-4">
                
                <!-- User Wise -->
                <div class="flex flex-col gap-2 w-full relative">
                    <div class="flex flex-col gap-1 items-start">
                        <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">User Wise</label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="all-users-checkbox" checked onchange="toggleUserWise()" class="w-4 h-4 accent-[var(--primary-blue)] cursor-pointer">
                            <span class="text-[14px] text-[#4d4d4d] font-medium">Allowed for all users</span>
                        </label>
                    </div>
                    <div id="user-wise-container" class="hidden flex-col gap-2 w-full">
                        <div class="flex items-center gap-2 relative">
                            <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg flex-1 bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors relative">
                                <input type="text" id="user-input" oninput="showUserSuggestions()" placeholder="Enter User id" class="form-input w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] border-none focus:ring-0">
                            </div>
                            <button type="button" onclick="addUser()" class="h-[52px] px-5 bg-[var(--primary-blue)] text-white rounded-lg text-[16px] font-medium hover:bg-blue-600 transition-colors">
                                Add
                            </button>
                            <!-- Suggestions Dropdown -->
                            <div id="user-suggestions" class="absolute top-[56px] left-0 right-[80px] bg-white border border-[#d7d7d7] rounded-lg shadow-lg z-50 hidden max-h-[200px] overflow-y-auto">
                            </div>
                        </div>
                        <div id="user-chips-container" class="flex flex-wrap gap-2 mt-1 empty:hidden"></div>
                    </div>
                </div>

                <!-- Turf Wise -->
                <div class="flex flex-col gap-2 w-full">
                    <div class="flex flex-col gap-1 items-start">
                        <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Turf Wise</label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="all-turf-checkbox" checked onchange="toggleTurfWise()" class="w-4 h-4 accent-[var(--primary-blue)] cursor-pointer">
                            <span class="text-[14px] text-[#4d4d4d] font-medium">Allowed for all Turf</span>
                        </label>
                    </div>
                    <div id="turf-wise-container" class="hidden border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white relative cursor-pointer" onclick="openBS('turf-select')">
                        <input type="text" id="turf-display" readonly placeholder="Select Turf" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] pointer-events-none border-none focus:ring-0 cursor-pointer">
                        <div class="absolute right-3 pointer-events-none text-[#1A1A1A]">
                            <i data-lucide="chevron-down" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <!-- Day Wise -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Day Wise</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white relative cursor-pointer" onclick="openBS('day-type')">
                        <input type="text" id="day-wise-display" readonly placeholder="Select Days" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] pointer-events-none border-none focus:ring-0 cursor-pointer">
                        <div class="absolute right-3 pointer-events-none text-[#1A1A1A]">
                            <i data-lucide="chevron-down" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <!-- Time Settings -->
                <div class="flex flex-col gap-3 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Time Settings</label>
                    
                    <!-- Peak Hours -->
                    <div class="w-full">
                        <label class="text-[13px] text-[#4d4d4d] font-semibold mb-2 block">Peak Hours</label>
                        <div class="flex items-center gap-2">
                            <div class="flex-1 border border-[#d7d7d7] rounded-[6px] h-[48px] flex items-center px-3 cursor-pointer" onclick="openPureTimePicker('peak-start')">
                                <input type="text" id="peak-start-display" readonly placeholder="Start Time" class="w-full text-[14px] text-[#0f0f0f] bg-transparent outline-none pointer-events-none text-center">
                            </div>
                            <span class="text-[#ababab] font-medium text-[14px]">to</span>
                            <div class="flex-1 border border-[#d7d7d7] rounded-[6px] h-[48px] flex items-center px-3 cursor-pointer" onclick="openPureTimePicker('peak-end')">
                                <input type="text" id="peak-end-display" readonly placeholder="End Time" class="w-full text-[14px] text-[#0f0f0f] bg-transparent outline-none pointer-events-none text-center">
                            </div>
                        </div>
                    </div>

                    <!-- Non-Peak Hours -->
                    <div class="w-full mt-2">
                        <label class="text-[13px] text-[#4d4d4d] font-semibold mb-2 block">Non-Peak Hours</label>
                        <div class="flex items-center gap-2">
                            <div class="flex-1 border border-[#d7d7d7] rounded-[6px] h-[48px] flex items-center px-3 cursor-pointer" onclick="openPureTimePicker('nonpeak-start')">
                                <input type="text" id="nonpeak-start-display" readonly placeholder="Start Time" class="w-full text-[14px] text-[#0f0f0f] bg-transparent outline-none pointer-events-none text-center">
                            </div>
                            <span class="text-[#ababab] font-medium text-[14px]">to</span>
                            <div class="flex-1 border border-[#d7d7d7] rounded-[6px] h-[48px] flex items-center px-3 cursor-pointer" onclick="openPureTimePicker('nonpeak-end')">
                                <input type="text" id="nonpeak-end-display" readonly placeholder="End Time" class="w-full text-[14px] text-[#0f0f0f] bg-transparent outline-none pointer-events-none text-center">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Coupon Name -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Coupon Name</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors">
                        <input type="text" placeholder="Coupon Name" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] border-none focus:ring-0">
                    </div>
                </div>

                <!-- Coupon Code -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Coupon Code</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors">
                        <input type="text" placeholder="Coupon Code" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent uppercase placeholder-[#ababab] border-none focus:ring-0">
                    </div>
                </div>

                <!-- Coupon Description -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Coupon Description</label>
                    <div class="border border-[#d7d7d7] flex items-start px-[12px] py-[8px] h-[100px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors">
                        <textarea placeholder="Description" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent resize-none placeholder-[#ababab] border-none focus:ring-0"></textarea>
                    </div>
                </div>

                <!-- Discount Type -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Discount Type</label>
                    <div class="flex flex-col gap-3">
                        <label class="border border-[#d7d7d7] flex items-center gap-3 px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white cursor-pointer focus-within:border-[var(--primary-blue)] transition-colors">
                            <input type="radio" name="discount_type" value="flat" checked onchange="updateDiscountSymbol()" class="w-5 h-5 accent-[var(--primary-blue)] cursor-pointer">
                            <span class="text-[#4d4d4d] text-[16px]">Flat</span>
                        </label>
                        <label class="border border-[#d7d7d7] flex items-center gap-3 px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white cursor-pointer focus-within:border-[var(--primary-blue)] transition-colors">
                            <input type="radio" name="discount_type" value="percentage" onchange="updateDiscountSymbol()" class="w-5 h-5 accent-[var(--primary-blue)] cursor-pointer">
                            <span class="text-[#4d4d4d] text-[16px]">Percentage</span>
                        </label>
                    </div>
                </div>

                <!-- Discount Value -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Discount Value</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors gap-2">
                        <span id="discount-symbol" class="text-[16px] text-[#4d4d4d] font-medium border-r border-[#d7d7d7] pr-2 w-[24px] text-center">₹</span>
                        <input type="number" min="0" oninput="validateAmount(this)" placeholder="Amount" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] border-none focus:ring-0">
                    </div>
                </div>

                <!-- Minimum Amount for Discount -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Minimum Amount for Discount</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors gap-2">
                        <span class="text-[16px] text-[#4d4d4d] font-medium border-r border-[#d7d7d7] pr-2 w-[24px] text-center">₹</span>
                        <input type="number" min="0" oninput="if(this.value < 0) this.value = Math.abs(this.value);" placeholder="Amount" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] border-none focus:ring-0">
                    </div>
                </div>

                <!-- Maximum Amount for Discount -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Maximum Amount for Discount</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors gap-2">
                        <span class="text-[16px] text-[#4d4d4d] font-medium border-r border-[#d7d7d7] pr-2 w-[24px] text-center">₹</span>
                        <input type="number" min="0" oninput="if(this.value < 0) this.value = Math.abs(this.value);" placeholder="Amount" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] border-none focus:ring-0">
                    </div>
                </div>

                <!-- Max Redeem Count -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Max Redeem Count</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors">
                        <input type="number" min="0" oninput="if(this.value < 0) this.value = Math.abs(this.value);" placeholder="Redeem Count" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] border-none focus:ring-0">
                    </div>
                </div>

                <!-- Minimum No. of Slot -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Minimum No. of Slot</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white focus-within:border-[var(--primary-blue)] focus-within:ring-1 focus-within:ring-[var(--primary-blue)] transition-colors">
                        <input type="number" min="1" max="100" placeholder="Slots" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] border-none focus:ring-0">
                    </div>
                </div>

                <!-- Coupon Start Date -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Start Date</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white relative cursor-pointer" onclick="openDateSelect('coupon-start')">
                        <input type="text" id="coupon-start-date-display" readonly placeholder="Select Date" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] pr-10 pointer-events-none border-none focus:ring-0 cursor-pointer">
                        <div class="absolute right-3 pointer-events-none text-[#1A1A1A]">
                            <i data-lucide="calendar" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <!-- Coupon End Date -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">End Date</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white relative cursor-pointer" onclick="openDateSelect('coupon-end')">
                        <input type="text" id="coupon-end-date-display" readonly placeholder="Select Date" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] pr-10 pointer-events-none border-none focus:ring-0 cursor-pointer">
                        <div class="absolute right-3 pointer-events-none text-[#1A1A1A]">
                            <i data-lucide="calendar" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <!-- Coupon Start Time -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">Start Time</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white relative cursor-pointer" onclick="openPureTimePicker('coupon-start-time')">
                        <input type="text" id="coupon-start-time-display" readonly placeholder="Select Time" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] pr-10 pointer-events-none border-none focus:ring-0 cursor-pointer">
                        <div class="absolute right-3 pointer-events-none text-[#1A1A1A]">
                            <i data-lucide="clock" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <!-- Coupon End Time -->
                <div class="flex flex-col gap-2 w-full">
                    <label class="text-[#1a1a1a] text-[14px] font-semibold leading-[1.6]">End Time</label>
                    <div class="border border-[#d7d7d7] flex items-center px-[12px] py-[8px] h-[52px] rounded-lg w-full bg-white relative cursor-pointer" onclick="openPureTimePicker('coupon-end-time')">
                        <input type="text" id="coupon-end-time-display" readonly placeholder="Select Time" class="w-full h-full text-[#0f0f0f] text-[16px] outline-none bg-transparent placeholder-[#ababab] pr-10 pointer-events-none border-none focus:ring-0 cursor-pointer">
                        <div class="absolute right-3 pointer-events-none text-[#1A1A1A]">
                            <i data-lucide="clock" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom Action Buttons -->
        <div class="px-4 py-2 flex items-center justify-center border-t border-[#d7d7d7] shadow-[0px_-2px_10px_rgba(0,0,0,0.05)] bg-[#fffefe] h-[80px] w-full z-20 flex-shrink-0">
            <div class="flex items-center w-full h-[48px] gap-2">
                <button onclick="showCancelPopup()" class="flex-1 flex justify-center items-center rounded-lg h-full text-[#1a1a1a] font-medium text-[16px]">
                    Cancel
                </button>
                <button onclick="showSuccessToaster()" class="flex-1 flex justify-center items-center rounded-lg h-full bg-[var(--primary-blue)] text-white font-medium text-[16px] hover:bg-blue-600 transition-colors">
                    Save Coupon
                </button>
            </div>
        </div>
        
    </div>

    <!-- ═══════════════════════════════════════
         BOTTOM SHEETS
    ═══════════════════════════════════════ -->

    <!-- Turf Selection Sheet -->
    <div id="bs-turf-select" class="bs-overlay" onclick="closeBS('turf-select')">
        <div class="bs-panel bg-white !h-[70vh] !max-h-[70vh]" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-5 py-4 border-b border-[#d7d7d7]">
                <h3 class="text-[18px] font-semibold text-[#1a1a1a]">Select Turf</h3>
                <button onclick="closeBS('turf-select')"><i data-lucide="x" class="w-5 h-5 text-[#1a1a1a]"></i></button>
            </div>
            <div class="px-5 py-3 border-b border-[#d7d7d7]">
                <div class="border border-[#d7d7d7] rounded-lg flex items-center px-3 h-[40px] bg-gray-50 focus-within:border-[var(--primary-blue)] focus-within:bg-white transition-colors">
                    <i data-lucide="search" class="w-4 h-4 text-[#ababab]"></i>
                    <input type="text" id="turf-search" oninput="renderTurfs()" placeholder="Search Turf" class="w-full h-full bg-transparent outline-none ml-2 text-[14px] text-[#0f0f0f]">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto px-2 py-2" id="turf-list"></div>
            <div class="p-4 border-t border-[#d7d7d7]">
                <button onclick="applyTurfSelect()" class="w-full h-[52px] rounded-lg bg-[var(--primary-blue)] text-white font-medium text-[16px] hover:bg-blue-600">
                    Apply Selection
                </button>
            </div>
        </div>
    </div>

    <!-- Day Type Sheet -->
    <div id="bs-day-type" class="bs-overlay" onclick="closeBS('day-type')">
        <div class="bs-panel bg-white" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-5 py-4 border-b border-[#d7d7d7]">
                <h3 class="text-[18px] font-semibold text-[#1a1a1a]">Select Days</h3>
                <button onclick="closeBS('day-type')"><i data-lucide="x" class="w-5 h-5 text-[#1a1a1a]"></i></button>
            </div>
            <div class="flex-1 px-4 py-4" id="day-type-list"></div>
        </div>
    </div>

    <!-- Custom Days Checkboxes Sheet -->
    <div id="bs-custom-days" class="bs-overlay" onclick="closeBS('custom-days')" style="z-index: 105;">
        <div class="bs-panel bg-white" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-5 py-4 border-b border-[#d7d7d7]">
                <h3 class="text-[18px] font-semibold text-[#1a1a1a]">Custom Days</h3>
                <button onclick="closeBS('custom-days')"><i data-lucide="x" class="w-5 h-5 text-[#1a1a1a]"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto px-2 py-2" id="custom-days-list"></div>
            <div class="p-4 border-t border-[#d7d7d7]">
                <button onclick="applyCustomDays()" class="w-full h-[52px] rounded-lg bg-[var(--primary-blue)] text-white font-medium text-[16px] hover:bg-blue-600">
                    Confirm Selection
                </button>
            </div>
        </div>
    </div>



    <!-- Pure Time Selection Sheet -->
    <div id="bs-pure-time-select" class="bs-overlay" onclick="closeBS('pure-time-select')" style="z-index: 105;">
        <div class="bs-panel bg-white" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-5 py-4 border-b border-[#d7d7d7]">
                <h3 class="text-[18px] font-semibold text-[#1a1a1a]">Select Time</h3>
                <button onclick="closeBS('pure-time-select')"><i data-lucide="x" class="w-5 h-5 text-[#1a1a1a]"></i></button>
            </div>
            <div class="p-5 flex-1 overflow-y-auto">
                <div class="time-grid" id="pure-time-list">
                    <!-- Javascript populates times -->
                </div>
            </div>
            <div class="p-4 border-t border-[#d7d7d7]">
                <button onclick="applyPureTime()" class="w-full h-[52px] rounded-lg bg-[var(--primary-blue)] text-white font-medium text-[16px] hover:bg-blue-600">
                    Confirm Time
                </button>
            </div>
        </div>
    </div>

    <!-- Date Selection Sheet (for start/end timeline) -->
    <div id="bs-date-select" class="bs-overlay" onclick="closeBS('date-select')">
        <div class="bs-panel bg-white" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-5 py-4 border-b border-[#d7d7d7]">
                <h3 class="text-[18px] font-semibold text-[#1a1a1a]">Select Date</h3>
                <button onclick="closeBS('date-select')"><i data-lucide="x" class="w-5 h-5 text-[#1a1a1a]"></i></button>
            </div>
            <div class="p-5 flex-col flex gap-2">
                <div class="flex items-center justify-between w-full mb-2">
                    <!-- Month Control -->
                    <div class="flex items-center gap-1">
                        <button onclick="changeDpMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        </button>
                        <div class="flex items-center gap-1 px-2 py-1 rounded-full text-[14px] font-medium text-[#1a1a1a] min-w-[60px] justify-center">
                            <span id="dp-month-lbl" class="select-none font-inter">Jan</span>
                        </div>
                        <button onclick="changeDpMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <!-- Year Control -->
                    <div class="flex items-center gap-1">
                        <button onclick="changeDpYear(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        </button>
                        <div class="flex items-center gap-1 px-2 py-1 rounded-full text-[14px] font-medium text-[#1a1a1a] min-w-[60px] justify-center">
                            <span id="dp-year-lbl" class="select-none font-inter">2025</span>
                        </div>
                        <button onclick="changeDpYear(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-[#4d4d4d] mb-2">
                    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                </div>
                <div class="cal-grid mt-0" id="bs-calendar-dates">
                    <!-- Javascript populates dates -->
                </div>
            </div>
            <div class="flex gap-2 p-4 border-t border-[#d7d7d7]">
                <button onclick="closeBS('date-select')" class="flex-1 h-[52px] rounded-lg border border-[#a3a3a3] text-[#1a1a1a] font-medium text-[16px] bg-white hover:bg-gray-50 transition-colors">
                    Cancel
                </button>
                <button onclick="confirmDateSelect()" class="flex-1 h-[52px] rounded-lg bg-[var(--primary-blue)] text-white font-medium text-[16px] hover:bg-blue-600 transition-colors">
                    Ok
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        /* Discount Input Restrictions */
        function validateAmount(input) {
            if(input.value < 0) {
                input.value = Math.abs(input.value);
            }
            const isPercentage = document.querySelector('input[name="discount_type"][value="percentage"]').checked;
            if (isPercentage && input.value > 100) {
                input.value = 100;
            }
        }
        function updateDiscountSymbol() {
            const isPercentage = document.querySelector('input[name="discount_type"][value="percentage"]').checked;
            const symbolEl = document.getElementById('discount-symbol');
            const inputEl = document.getElementById('discount-amount-input');
            if (isPercentage) {
                symbolEl.textContent = '%';
                if(inputEl.value > 100) inputEl.value = 100;
            } else {
                symbolEl.textContent = '₹';
            }
        }

        /* 1. User Add logic */
        function toggleUserWise() {
            const checkbox = document.getElementById('all-users-checkbox');
            const container = document.getElementById('user-wise-container');
            if (checkbox.checked) {
                container.classList.add('hidden');
                container.classList.remove('flex');
            } else {
                container.classList.remove('hidden');
                container.classList.add('flex');
            }
        }

        const dummyUsers = [
            { id: 'USR001', name: 'John Doe' },
            { id: 'USR002', name: 'Jane Smith' },
            { id: 'USR003', name: 'Alice Johnson' },
            { id: 'USR004', name: 'Bob Brown' },
            { id: 'USR005', name: 'Charlie Davis' }
        ];

        function showUserSuggestions() {
            const input = document.getElementById('user-input');
            const val = input.value.trim().toLowerCase();
            const suggestionsEl = document.getElementById('user-suggestions');
            
            if (!val) {
                suggestionsEl.classList.add('hidden');
                return;
            }
            
            const matches = dummyUsers.filter(u => u.id.toLowerCase().includes(val) || u.name.toLowerCase().includes(val));
            
            if (matches.length > 0) {
                suggestionsEl.innerHTML = matches.map(u => `
                    <div class="px-4 py-3 hover:bg-gray-50 cursor-pointer border-b last:border-0 border-[#f0f0f0]" onclick="selectUserSuggestion('${u.id}')">
                        <div class="text-[14px] font-medium text-[#1a1a1a]">${u.name}</div>
                        <div class="text-[12px] text-[#ababab]">${u.id}</div>
                    </div>
                `).join('');
                suggestionsEl.classList.remove('hidden');
            } else {
                suggestionsEl.innerHTML = `<div class="px-4 py-3 text-[14px] text-[#ababab] text-center">No users found</div>`;
                suggestionsEl.classList.remove('hidden');
            }
        }

        function selectUserSuggestion(id) {
            document.getElementById('user-input').value = id;
            document.getElementById('user-suggestions').classList.add('hidden');
        }
        
        // Hide suggestions on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#user-wise-container')) {
                const sugg = document.getElementById('user-suggestions');
                if(sugg) sugg.classList.add('hidden');
            }
        });

        function addUser() {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if(!val) return;
            
            const container = document.getElementById('user-chips-container');
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `
                <span>${val}</span>
                <button onclick="this.parentElement.remove()" class="flex items-center justify-center p-0.5 ml-1">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </button>
            `;
            container.appendChild(chip);
            input.value = '';
            document.getElementById('user-suggestions').classList.add('hidden');
            lucide.createIcons();
        }

        /* 2. Turf Selection */
        function toggleTurfWise() {
            const checkbox = document.getElementById('all-turf-checkbox');
            const container = document.getElementById('turf-wise-container');
            if (checkbox.checked) {
                container.classList.add('hidden');
            } else {
                container.classList.remove('hidden');
            }
        }

        const turfs = [
            { name: 'Fabzia Arena', frequent: true },
            { name: 'Skyline Sports Turf', frequent: false },
            { name: 'Green Park Turf', frequent: true },
            { name: 'Urban Kick Arena', frequent: false },
            { name: 'Olympia Turf', frequent: false },
            { name: 'City Kickers', frequent: true }
        ];
        const selectedTurfs = new Set();
        
        function renderTurfs() {
            const list = document.getElementById('turf-list');
            const searchInput = document.getElementById('turf-search');
            const searchQ = searchInput ? searchInput.value.toLowerCase() : '';
            list.innerHTML = '';
            
            let filteredTurfs = turfs.filter(t => t.name.toLowerCase().includes(searchQ));
            let frequentTurfs = filteredTurfs.filter(t => t.frequent).sort((a,b) => a.name.localeCompare(b.name));
            let otherTurfs = filteredTurfs.filter(t => !t.frequent).sort((a,b) => a.name.localeCompare(b.name));
            
            if (frequentTurfs.length > 0) {
                const head = document.createElement('div');
                head.className = 'px-3 py-2 text-[13px] font-semibold text-[#4d4d4d] uppercase tracking-wider';
                head.innerText = 'Frequently Searched';
                list.appendChild(head);
                frequentTurfs.forEach(t => list.appendChild(createTurfEl(t.name)));
            }
            if (otherTurfs.length > 0) {
                const head = document.createElement('div');
                head.className = 'px-3 py-2 text-[13px] font-semibold text-[#4d4d4d] uppercase tracking-wider mt-2';
                head.innerText = 'All Turfs';
                list.appendChild(head);
                otherTurfs.forEach(t => list.appendChild(createTurfEl(t.name)));
            }
            if (filteredTurfs.length === 0) {
                list.innerHTML = `<div class="p-4 text-center text-[#ababab] text-[14px]">No turfs found</div>`;
            }
            lucide.createIcons();
        }
        
        function createTurfEl(turfName) {
            const isSelected = selectedTurfs.has(turfName);
            const el = document.createElement('div');
            el.className = 'flex items-center justify-between px-3 py-3 hover:bg-gray-50 cursor-pointer rounded-lg mb-1';
            el.onclick = () => {
                if (selectedTurfs.has(turfName)) selectedTurfs.delete(turfName);
                else selectedTurfs.add(turfName);
                renderTurfs();
            };
            el.innerHTML = `
                <span class="text-[15px] text-[#1a1a1a] font-medium">${turfName}</span>
                <div class="check-box ${isSelected ? 'active' : ''}">
                    ${isSelected ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                </div>
            `;
            return el;
        }

        function applyTurfSelect() {
            const display = document.getElementById('turf-display');
            display.value = selectedTurfs.size === 0 ? '' : selectedTurfs.size === 1 ? Array.from(selectedTurfs)[0] : `${selectedTurfs.size} Turfs Selected`;
            closeBS('turf-select');
        }
        renderTurfs();

        /* Day Wise Logic */
        const dayOptions = [
            { id: 'all', label: 'All Days' },
            { id: 'weekdays', label: 'Weekdays (Mon - Fri)' },
            { id: 'weekends', label: 'Weekends (Sat - Sun)' },
            { id: 'custom_days', label: 'Custom days' }
        ];
        let currentDayOption = '';
        function renderDayType() {
            const list = document.getElementById('day-type-list');
            list.innerHTML = '';
            dayOptions.forEach(opt => {
                const isSelected = currentDayOption === opt.id;
                const el = document.createElement('div');
                el.className = 'flex items-center gap-3 px-1 py-3 cursor-pointer mb-2';
                el.onclick = () => { 
                    currentDayOption = opt.id; 
                    renderDayType(); 
                    
                    if (opt.id === 'custom_days') {
                        closeBS('day-type');
                        renderCustomDaysCheckboxes();
                        openBS('custom-days');
                    } else if (opt.id === 'custom_dates') {
                        closeBS('day-type');
                        renderCustomDatesCal();
                        openBS('custom-dates');
                    } else {
                        closeBS('day-type');
                        document.getElementById('day-wise-display').value = opt.label;
                    }
                };
                el.innerHTML = `
                    <div class="radio-btn ${isSelected ? 'active' : ''}"></div>
                    <span class="text-[16px] text-[#4d4d4d] font-medium">${opt.label}</span>
                `;
                list.appendChild(el);
            });
        }
        renderDayType();

        /* Custom Days Logic */
        const weekDaysArr = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const selectedCustomDays = new Set();
        function renderCustomDaysCheckboxes() {
            const list = document.getElementById('custom-days-list');
            list.innerHTML = '';
            weekDaysArr.forEach(day => {
                const isSelected = selectedCustomDays.has(day);
                const el = document.createElement('div');
                el.className = 'flex items-center justify-between px-3 py-3 hover:bg-gray-50 cursor-pointer rounded-lg mb-1';
                el.onclick = () => {
                    if (selectedCustomDays.has(day)) selectedCustomDays.delete(day);
                    else selectedCustomDays.add(day);
                    renderCustomDaysCheckboxes();
                };
                el.innerHTML = `
                    <span class="text-[15px] text-[#1a1a1a] font-medium">${day}</span>
                    <div class="check-box ${isSelected ? 'active' : ''}">
                        ${isSelected ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                    </div>
                `;
                list.appendChild(el);
            });
            lucide.createIcons();
        }
        function applyCustomDays() {
            if (selectedCustomDays.size > 0) {
                const count = selectedCustomDays.size;
                document.getElementById('day-wise-display').value = count === 1 ? Array.from(selectedCustomDays)[0] : `${count} Custom Days`;
            } else {
                document.getElementById('day-wise-display').value = '';
            }
            closeBS('custom-days');
        }



        /* Pure Time Picker */
        let pureTimeEditingField = null; // 'peak-start' | 'peak-end' | 'nonpeak-start' | 'nonpeak-end'
        let selectedPureTime = null;

        function openPureTimePicker(fieldId) {
            pureTimeEditingField = fieldId;
            selectedPureTime = null;
            renderPureTimeList();
            openBS('pure-time-select');
        }

        function renderPureTimeList() {
            const timeList = document.getElementById('pure-time-list');
            let timeHtml = '';
            const times = ["06:00 AM", "07:00 AM", "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM", "05:00 PM", "06:00 PM", "07:00 PM", "08:00 PM", "09:00 PM", "10:00 PM", "11:00 PM"];
            times.forEach((t) => {
                timeHtml += `<div class="time-cell" onclick="selectPureTime(this, '${t}')">${t}</div>`;
            });
            timeList.innerHTML = timeHtml;
        }

        function selectPureTime(el, timeStr) {
            document.querySelectorAll('#pure-time-list .time-cell').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedPureTime = timeStr;
        }

        function applyPureTime() {
            if(!selectedPureTime) {
                alert("Please select a time");
                return;
            }
            document.getElementById(pureTimeEditingField + '-display').value = selectedPureTime;
            closeBS('pure-time-select');
        }

        /* Date Select Logic */
        let dateEditingField = null; // 'coupon-start' or 'coupon-end'
        let tempSelectedDate = null;
        let pendingDateNumber = null;

        let currentCalMonth = new Date().getMonth();
        let currentCalYear = new Date().getFullYear();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const fullMonthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function openDateSelect(fieldId) {
            dateEditingField = fieldId;
            tempSelectedDate = null;
            pendingDateNumber = null;
            const now = new Date();
            currentCalMonth = now.getMonth();
            currentCalYear = now.getFullYear();
            renderDateSelectCal();
            openBS('date-select');
        }

        function changeDpMonth(delta) {
            currentCalMonth += delta;
            if (currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; }
            if (currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
            renderDateSelectCal();
        }

        function changeDpYear(delta) {
            currentCalYear += delta;
            renderDateSelectCal();
        }

        function renderDateSelectCal() {
            document.getElementById('dp-month-lbl').innerText = monthNames[currentCalMonth];
            document.getElementById('dp-year-lbl').innerText = currentCalYear;

            const cal = document.getElementById('bs-calendar-dates');
            let html = '';
            
            const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
            const daysInMonth = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
            
            let startDateObj = null;
            if (dateEditingField === 'coupon-end') {
                const startStr = document.getElementById('coupon-start-date-display').value;
                if (startStr) {
                    const cleanStr = startStr.replace(/(st|nd|rd|th)/, '');
                    startDateObj = new Date(cleanStr);
                    startDateObj.setHours(0,0,0,0);
                }
            }

            for(let i=0; i<firstDay; i++) {
                html += `<div class="cal-cell other-month"></div>`;
            }
            
            for(let d=1; d<=daysInMonth; d++) {
                const cellDate = new Date(currentCalYear, currentCalMonth, d);
                cellDate.setHours(0,0,0,0);
                
                let isDisabled = false;
                if (startDateObj && cellDate <= startDateObj) {
                    isDisabled = true;
                }
                
                const selectedClass = (pendingDateNumber === d) ? 'selected' : '';
                
                if (isDisabled) {
                    html += `<div class="cal-cell other-month" style="opacity: 0.5; pointer-events: none;">${d}</div>`;
                } else {
                    html += `<div class="cal-cell ${selectedClass}" onclick="selectDateOnly(this, ${d})">${d}</div>`;
                }
            }
            cal.innerHTML = html;
        }

        function selectDateOnly(el, day) {
            pendingDateNumber = day;
            // E.g. "12th Jan 2025" logic:
            let suffix = "th";
            if (day % 10 === 1 && day !== 11) suffix = "st";
            else if (day % 10 === 2 && day !== 12) suffix = "nd";
            else if (day % 10 === 3 && day !== 13) suffix = "rd";
            
            tempSelectedDate = `${day}${suffix} ${monthNames[currentCalMonth]} ${currentCalYear}`;
            renderDateSelectCal();
        }

        function confirmDateSelect() {
            if(!tempSelectedDate) {
                alert("Please select a date from the calendar");
                return;
            }
            document.getElementById(dateEditingField + '-date-display').value = tempSelectedDate;
            closeBS('date-select');
        }

        // Bottom Sheet Utilities
        function openBS(id) {
            document.getElementById('bs-' + id).classList.add('open');
        }
        function closeBS(id) {
            document.getElementById('bs-' + id).classList.remove('open');
        }

        function showCancelPopup() {
            openBS('cancel-confirm');
        }

        function confirmCancel() {
            closeBS('cancel-confirm');
            showErrorToaster();
            setTimeout(() => {
                window.history.back();
            }, 1500);
        }

        function showSuccessToaster() {
            const t = document.getElementById('success-toaster');
            t.classList.remove('-translate-y-[150%]');
            t.classList.add('translate-y-0');
            setTimeout(() => {
                t.classList.remove('translate-y-0');
                t.classList.add('-translate-y-[150%]');
            }, 3000);
        }

        function showErrorToaster() {
            const t = document.getElementById('error-toaster');
            t.classList.remove('-translate-y-[150%]');
            t.classList.add('translate-y-0');
            setTimeout(() => {
                t.classList.remove('translate-y-0');
                t.classList.add('-translate-y-[150%]');
            }, 3000);
        }

    </script>

    <!-- Error Toaster -->
    <div id="error-toaster" class="fixed top-4 left-1/2 -translate-x-1/2 bg-[#fee2e2] text-[#ef4444] px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-transform duration-300 transform -translate-y-[150%] z-[200] w-[90%] max-w-[380px]">
        <div class="w-6 h-6 rounded-full bg-[#ef4444] text-white flex items-center justify-center flex-shrink-0">
            <i data-lucide="x" class="w-4 h-4"></i>
        </div>
        <span class="text-[14px] font-medium">Changes are Not updated!</span>
    </div>

    <!-- Success Toaster -->
    <div id="success-toaster" class="fixed top-4 left-1/2 -translate-x-1/2 bg-[#dcfce7] text-[#22c55e] px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-transform duration-300 transform -translate-y-[150%] z-[200] w-[90%] max-w-[380px]">
        <div class="w-6 h-6 rounded-full bg-[#22c55e] text-white flex items-center justify-center flex-shrink-0">
            <i data-lucide="check" class="w-4 h-4"></i>
        </div>
        <span class="text-[14px] font-medium">Coupon has been made Successfully</span>
    </div>

    <!-- Cancel Confirmation Sheet -->
    <div id="bs-cancel-confirm" class="bs-overlay" onclick="closeBS('cancel-confirm')" style="z-index: 105;">
        <div class="bs-panel bg-white !rounded-t-[20px] !max-h-[auto]" onclick="event.stopPropagation()">
            <div class="p-6 flex flex-col gap-4">
                <h3 class="text-[18px] font-semibold text-[#1a1a1a] text-left">Are you sure you want to Cancel Changes ?</h3>
                <div class="flex items-center gap-3 mt-2">
                    <button onclick="closeBS('cancel-confirm')" class="flex-1 h-[48px] rounded-lg text-[#1a1a1a] font-medium text-[16px] hover:bg-gray-50 transition-colors">
                        No
                    </button>
                    <button onclick="confirmCancel()" class="flex-1 h-[48px] rounded-lg bg-[#ef4444] text-white font-medium text-[16px] hover:bg-red-600 transition-colors">
                        Cancel Changes
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
